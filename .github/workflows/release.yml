name: Release

on:
  push:
    tags:
      - v*
  pull_request:
    branches:
      - main

jobs:
  release:
    uses: adsgames/deploy-to-adsgames/.github/workflows/release-game.yml@v1
    permissions:
      id-token: write
      contents: read
    with:
      project-id: breaker
      # Pull requests only check that every platform builds, and dry run adsgames.json
      deploy: ${{ startsWith(github.ref, 'refs/tags/v') }}
    secrets:
      ADSGAMES_API_KEY: ${{ secrets.ADSGAMES_API_KEY }}
